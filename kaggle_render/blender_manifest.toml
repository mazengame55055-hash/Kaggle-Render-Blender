  "./wheels/charset_normalizer-3.5.2-py3-none-any.whl",
  "./wheels/idna-3.20-py3-none-any.whl",
  "./wheels/kaggle-2.2.4-py3-none-any.whl",
  "./wheels/kagglesdk-0.1.37-py3-none-any.whl",
  "./wheels/packaging-26.3-py3-none-any.whl",
  "./wheels/protobuf-7.36.2-py3-none-any.whl",
  "./wheels/python_dateutil-2.9.0.post0-py2.py3-none-any.whl",
  "./wheels/python_dotenv-1.2.4-py3-none-any.whl",
  "./wheels/python_slugify-9.1.3-py3-none-any.whl",
  "./wheels/requests-2.34.2-py3-none-any.whl",
  "./wheels/six-1.17.0-py2.py3-none-any.whl",
  "./wheels/text_unidecode-1.3-py2.py3-none-any.whl",
